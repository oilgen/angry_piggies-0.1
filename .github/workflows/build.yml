name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean Buildozer cache
        run: |
          rm -rf "Angry Piggies/.buildozer"
          rm -rf "Angry Piggies/bin"

      - name: Build with Buildozer Docker
        uses: addnab/docker-run-action@v3
        with:
          image: kivy/buildozer:latest
          options: -v ${{ github.workspace }}:/home/user/hostcwd
          run: |
            # Копируем проект в папку без пробелов
            cp -r "/home/user/hostcwd/Angry Piggies" /home/user/project
            cd /home/user/project
            # Запускаем сборку
            yes | buildozer android debug
            # Копируем готовый APK обратно в рабочую папку GitHub
            cp bin/*.apk "/home/user/hostcwd/Angry Piggies/bin/" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: Angry Piggies/bin/*.apk
