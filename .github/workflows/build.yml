name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean Buildozer cache
        run: |
          rm -rf "Angry Piggies/.buildozer"
          rm -rf "Angry Piggies/bin"

      - name: Build with Buildozer Docker
        uses: addnab/docker-run-action@v3
        with:
          image: kivy/buildozer:latest
          options: -v ${{ github.workspace }}:/home/user/hostcwd
          run: |
            cp -r "/home/user/hostcwd/Angry Piggies" /home/user/project
            cd /home/user/project
            
            # Даем Buildozer команду с максимальным логом
            # (log_level=2 в buildozer.spec уже должен быть, но на всякий случай)
            yes | buildozer -v android debug
            
            # Проверяем, создался ли APK в папке bin
            ls -la bin/
            
            # Копируем ВСЕ apk файлы (если они есть) обратно в папку проекта
            mkdir -p "/home/user/hostcwd/Angry Piggies/bin"
            cp bin/*.apk "/home/user/hostcwd/Angry Piggies/bin/" || echo "APK НЕ НАЙДЕН В КОНТЕЙНЕРЕ!"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            AngryPiggies/bin/*.apk
            Angry Piggies/bin/*.apk
            **/*.apk
            /home/user/project/bin/*.apk
