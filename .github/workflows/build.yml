name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # <-- ИЗМЕНЕНО НА 3.8

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev autoconf libtool pkg-config zlib1g-dev automake

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android Build-Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "build-tools;34.0.0"

      - name: Add AIDL to PATH
        run: |
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Устанавливаем Buildozer напрямую с GitHub (master), а не из PyPI
          pip install git+https://github.com/kivy/buildozer.git@master
          pip install cython==0.29.33 virtualenv

      # --- ДОБАВЛЕН ШАГ ОЧИСТКИ ---
      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
        working-directory: ./Angry Piggies

      - name: Force update python-for-android
        run: |
          rm -rf .buildozer/android/platform/python-for-android
        working-directory: ./Angry Piggies
        
      - name: Build APK with Buildozer
        run: |
          echo y | buildozer -v android debug
        working-directory: ./Angry Piggies
        env:
          P4A_BUILD_MODE: debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: Angry Piggies/bin/*.apk
