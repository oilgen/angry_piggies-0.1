name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "Текущая папка:"
          pwd
          echo "Файлы в текущей папке:"
          ls -la
          echo "Файлы в папке проекта:"
          ls -la ./Angry Piggies || echo "Папка не найдена!"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --user --upgrade buildozer
          pip install --user --upgrade Cython==0.29.34 virtualenv

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer -v android debug
        working-directory: ./Angry Piggies

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: Angry Piggies/bin/*.apk
