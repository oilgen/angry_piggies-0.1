name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean Buildozer cache
        run: |
          rm -rf "Angry Piggies/.buildozer"
          rm -rf "Angry Piggies/bin"

      - name: Build with Buildozer Docker
        uses: addnab/docker-run-action@v3
        with:
          image: kivy/buildozer:latest
          options: -v ${{ github.workspace }}:/home/user/hostcwd
          run: |
            cp -r "/home/user/hostcwd/Angry Piggies" /home/user/project
            cd /home/user/project
            yes | buildozer android debug
            
            # Копируем ВСЕ apk файлы из папки bin контейнера в папку проекта
            mkdir -p "/home/user/hostcwd/Angry Piggies/bin"
            cp bin/*.apk "/home/user/hostcwd/Angry Piggies/bin/" || true
            # На всякий случай копируем и в корень проекта
            cp bin/*.apk "/home/user/hostcwd/" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            AngryPiggies/bin/*.apk
            Angry Piggies/bin/*.apk
            **/*.apk
            /home/user/project/bin/*.apk
