name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. JDK 17 (нужен и для setup-android, и для Buildozer)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Python (3.10 — стабильно для Buildozer)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Системные зависимости
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev autoconf libtool pkg-config zlib1g-dev automake

      # 4. Android SDK (без установки пакета 'tools', которого больше нет)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # 5. Установка Build-Tools (здесь лежит aidl)
      - name: Install Android Build-Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "build-tools;34.0.0"

      # 6. Добавляем aidl в PATH
      - name: Add AIDL to PATH
        run: |
          echo "ANDROID_HOME is: $ANDROID_HOME"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          # Проверка, что путь записался (выполнится в следующем шаге)
          echo "Path added: $ANDROID_HOME/build-tools/34.0.0"

      # 7. Установка Buildozer и Cython
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.33 virtualenv

      # 8. Сборка APK (с указанием рабочей папки!)
      - name: Build APK with Buildozer
        run: |
          echo y | buildozer -v android debug
        working-directory: ./Angry Piggies
        env:
          P4A_BUILD_MODE: debug

      # 9. Загрузка APK (с полным путём)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: Angry Piggies/bin/*.apk
